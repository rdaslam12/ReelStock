{% if assets.paginator.num_pages > 1 %}
<nav aria-label="Library pages" class="mt-5">
  <ul class="pagination justify-content-center">
    {% if assets.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?type={{ media_type }}&page={{ assets.previous_page_number }}{% if current_category %}&category={{ current_category|urlencode }}{% endif %}{% if search_query %}&search={{ search_query|urlencode }}{% endif %}">Previous</a>
      </li>
    {% endif %}
    {% for p in assets.paginator.page_range %}
      <li class="page-item {% if p == assets.number %}active{% endif %}">
        <a class="page-link" href="?type={{ media_type }}&page={{ p }}{% if current_category %}&category={{ current_category|urlencode }}{% endif %}{% if search_query %}&search={{ search_query|urlencode }}{% endif %}">{{ p }}</a>
      </li>
    {% endfor %}
    {% if assets.has_next %}
      <li class="page-item">
        <a class="page-link" href="?type={{ media_type }}&page={{ assets.next_page_number }}{% if current_category %}&category={{ current_category|urlencode }}{% endif %}{% if search_query %}&search={{ search_query|urlencode }}{% endif %}">Next</a>
      </li>
    {% endif %}
  </ul>
</nav>
{% endif %}
